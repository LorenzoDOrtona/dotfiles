general {
    # Pause all media and lock the screen
    lock_cmd = playerctl pause; pidof hyprlock || hyprlock

    # Lock the session right before the system suspends (e.g., when closing the lid)
    before_sleep_cmd = loginctl lock-session 
    
    # Turn the screen back on when waking up
    after_sleep_cmd = hyprctl dispatch dpms on 
}

# 1. Turn off the screen after 5 minutes of inactivity (300 seconds)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 2. Lock the screen after 5.5 minutes (330 seconds)
listener {
    timeout = 330
    on-timeout = loginctl lock-session
}

# 3. Suspend the entire system after 15 minutes (900 seconds)
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
